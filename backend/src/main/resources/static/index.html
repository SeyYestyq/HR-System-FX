<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Вход — Найм</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<section id="view-login" class="login-screen">
  <div class="login-story">
    <div class="brand" style="margin-bottom:24px"><span class="mark" aria-hidden="true"></span> Найм</div>
    <h1>Стол вакансий</h1>
    <p class="lede">Коды, вилки и приоритет найма в одном списке</p>
    <article class="dossier">
      <div class="dossier-top">
        <span class="code">VAC-2026-0001</span>
        <span class="stamp high">HIGH</span>
      </div>
      <h2>Java Backend Developer</h2>
      <div class="muted">Яндекс · удалённо</div>
      <div class="mono" style="margin-top:16px;font-size:18px">220 000 – 320 000</div>
    </article>
  </div>
  <div class="auth-pane">
    <div class="auth-card" id="loginCard">
      <h1>Вход</h1>
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" required autocomplete="username" placeholder="admin@example.org"/>
        </div>
        <div class="field">
          <label for="loginPassword">Пароль</label>
          <input id="loginPassword" type="password" required autocomplete="current-password"/>
        </div>
        <button type="submit">Войти</button>
        <div id="loginError" class="error" role="alert"></div>
      </form>
    </div>

    <div class="auth-card hidden" id="passwordCard">
      <h1>Смена пароля</h1>
      <p class="muted" style="margin-top:-8px;margin-bottom:16px">Временный пароль нужно заменить перед работой</p>
      <form id="passwordForm">
        <div class="field">
          <label for="currentPassword">Текущий пароль</label>
          <input id="currentPassword" type="password" required autocomplete="current-password"/>
        </div>
        <div class="field">
          <label for="newPassword">Новый пароль</label>
          <input id="newPassword" type="password" required minlength="8" autocomplete="new-password"/>
        </div>
        <div class="field">
          <label for="confirmPassword">Подтверждение</label>
          <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password"/>
        </div>
        <button type="submit">Сохранить и продолжить</button>
        <div id="passwordError" class="error" role="alert"></div>
      </form>
    </div>
  </div>
</section>

<script src="/api.js"></script>
<script src="/app.js"></script>
<script>
'use strict';

const loginCard = document.getElementById('loginCard');
const passwordCard = document.getElementById('passwordCard');

function showPasswordForm(prefillCurrent) {
  loginCard.classList.add('hidden');
  passwordCard.classList.remove('hidden');
  if (prefillCurrent) document.getElementById('currentPassword').value = prefillCurrent;
}

async function goToApp() {
  window.location.href = '/vacancies.html';
}

async function bootstrap() {
  if (!Api.getToken()) return;
  try {
    const user = await Api.me();
    if (user.mustChangePassword || location.hash === '#change-password') {
      showPasswordForm('');
      return;
    }
    await goToApp();
  } catch (_) {
    Api.clearSession();
  }
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  try {
    const data = await Api.login(email, password);
    if (data.mustChangePassword || data.user?.mustChangePassword) {
      showPasswordForm(password);
      return;
    }
    await goToApp();
  } catch (err) {
    const status = err.status;
    const msg = String(err.message || '');
    if (status === 429 || status === 423 || /слишком много|заблок/i.test(msg)) {
      errEl.textContent = 'Слишком много попыток, попробуйте позже';
    } else {
      errEl.textContent = msg || 'Не удалось войти';
    }
  }
});

document.getElementById('passwordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('passwordError');
  errEl.textContent = '';
  const next = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if (next !== confirm) {
    errEl.textContent = 'Пароли не совпадают';
    return;
  }
  if (next.length < 8) {
    errEl.textContent = 'Новый пароль — минимум 8 символов';
    return;
  }
  try {
    await Api.changePassword(document.getElementById('currentPassword').value, next);
    const user = Api.currentUser();
    if (user) user.mustChangePassword = false;
    await goToApp();
  } catch (err) {
    App.handleApiError(err, errEl);
  }
});

bootstrap();
</script>
</body>
</html>
